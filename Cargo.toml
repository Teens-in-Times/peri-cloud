[workspace]
members = [
    "peri-acp-types",
    "peri-agent",
    "peri-cloud",
    "peri-executor",
    "peri-js-runtime",
    "peri-lsp",
    "peri-middlewares",
    "peri-model",
    "peri-process",
    "peri-remote-tools",
    "peri-resources",
    "peri-tool-runtime",
    "peri-workflow",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"

[profile.release]
strip = "symbols"
opt-level = "z"
lto = true
codegen-units = 1

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"

reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }

chrono = { version = "0.4", features = ["serde"] }

anyhow = "1.0"
thiserror = "2.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
tracing-appender = "0.2"

uuid = { version = "1", features = ["v4", "v7", "serde"] }
parking_lot = "0.12"
dirs-next = "2"
url = "2"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
sysinfo = "0.39"
lsp-types = "0.97"
lru = "0.18"

tempfile = "3"

tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats", "use_std"] }
tikv-jemalloc-sys = "0.6"

clap = { version = "4", features = ["derive", "env"] }
semver = "1"
sha2 = "0.10"

axum = { version = "0.8.9", features = ["ws"] }
portable-pty = "0.9"
tokio-tungstenite = "0.30"
serial_test = { version = "4.0.1", features = ["async"] }
