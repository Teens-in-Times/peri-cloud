name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloud-executor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install Windows check components
        if: runner.os == 'Windows'
        run: rustup component add --toolchain 1.99.0 rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Format
        if: runner.os == 'Windows'
        run: cargo +1.99.0 fmt --all -- --check
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: runner.os == 'Windows'
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: scripts/portal-ui/package-lock.json
      - name: Portal DOM regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm ci --prefix scripts/portal-ui --ignore-scripts --no-audit --no-fund
          $env:NODE_PATH = Join-Path $pwd 'scripts/portal-ui/node_modules'
          node scripts/check-portal-ui.cjs
          node scripts/check-model-ui.cjs
      - name: Cloud and executor regression tests
        if: runner.os == 'Windows'
        run: cargo +1.99.0 test --locked -p peri-cloud -p peri-executor -p peri-remote-tools -p peri-tool-runtime -p peri-process
      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo +1.99.0 clippy --locked -p peri-cloud -p peri-executor --all-targets --no-deps -- -D warnings
      - name: Build optimized binaries
        run: cargo +1.99.0 build --release --locked -p peri-cloud --bin peri-cloud-host -p peri-executor --bin peri-executor
      - name: Preserve verified native binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.os }}
          path: |
            target/release/peri-cloud-host
            target/release/peri-cloud-host.exe
            target/release/peri-executor
            target/release/peri-executor.exe
          if-no-files-found: error
          retention-days: 7
      - name: Linux release process smoke
        if: runner.os == 'Linux'
        run: python3 scripts/smoke-release.py target/release peri-cloud/src/portal/assets
      - name: Linux isolated executor smoke
        if: runner.os == 'Linux'
        run: sudo env GITHUB_ACTIONS=true RUNNER_OS=Linux python3 scripts/smoke-isolated-executor.py target/release/peri-executor
